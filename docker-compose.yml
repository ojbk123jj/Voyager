# Voyager 生产编排
# 启动：docker compose up -d --build
# 日志：docker compose logs -f
# 停止：docker compose down
#
# 数据管理（Prisma Studio，按需启动）：
#   服务器上启动：docker compose --profile admin up -d studio
#   本地 SSH 隧道：ssh -L 5555:127.0.0.1:5555 voyager
#   浏览器访问：  http://localhost:5555
#   用完关闭：    docker compose --profile admin down studio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: voyager-app:latest
    container_name: voyager-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/voyager.db
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - voyager_data:/app/data
    networks:
      - voyager_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: voyager-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - voyager_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - app

  # ---------------------------------------------------------------------------
  # Prisma Studio：图形化管理数据库，按需启动
  # 仅监听 127.0.0.1:5555（本机回环），必须通过 SSH 隧道访问，不暴露到公网
  # ---------------------------------------------------------------------------
  studio:
    profiles: ["admin"]
    image: voyager-app:latest # 复用 app 镜像，无需重新构建
    container_name: voyager-studio
    restart: "no"
    environment:
      DATABASE_URL: file:/app/data/voyager.db
    volumes:
      - voyager_data:/app/data
    networks:
      - voyager_net
    ports:
      - "127.0.0.1:5555:5555"
    entrypoint: []
    command:
      - sh
      - -c
      - "node node_modules/prisma/build/index.js studio --port 5555 --hostname 0.0.0.0 --browser none"

volumes:
  voyager_data: # SQLite 持久化
  caddy_data: # Caddy 自动签发的证书
  caddy_config:

networks:
  voyager_net:
    driver: bridge
